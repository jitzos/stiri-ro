name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $expected = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag $env:RELEASE_TAG does not match package version $expected"
          }
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      - name: Build Windows release
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Publish release assets
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $env:RELEASE_TAG --generate-notes
          }

          $files = Get-ChildItem release/installer -File | Where-Object {
            $_.Name -eq "latest.yml" -or
            $_.Name -match '^StiriRO-Setup-.+\.exe$' -or
            $_.Name -match '^StiriRO-Setup-.+\.exe\.blockmap$'
          } | ForEach-Object { $_.FullName }

          if ($files.Count -ne 3) {
            throw "Expected installer, blockmap, and latest.yml; found $($files.Count) release files."
          }

          gh release upload $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
