name: Windows release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]'))
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Resolve and verify release version
        shell: pwsh
        run: |
          $expected = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          $requested = $env:REQUESTED_TAG
          if ($requested -and $requested -ne $expected) {
            throw "Requested tag $requested does not match package version $expected"
          }
          "RELEASE_TAG=$expected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          REQUESTED_TAG: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.tag || '' }}

      - name: Build Windows release
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Publish release assets
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $env:RELEASE_TAG --generate-notes
          }

          $files = Get-ChildItem release/installer -File | Where-Object {
            $_.Name -eq "latest.yml" -or
            $_.Name -match '^StiriRO-Setup-.+\.exe$' -or
            $_.Name -match '^StiriRO-Setup-.+\.exe\.blockmap$'
          } | ForEach-Object { $_.FullName }

          if ($files.Count -ne 3) {
            throw "Expected installer, blockmap, and latest.yml; found $($files.Count) release files."
          }

          gh release upload $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  ios-release:
    needs: release
    runs-on: macos-15
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up release version
        shell: bash
        run: echo "RELEASE_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native iOS project
        run: cd ios && xcodegen generate --spec project.yml

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/StiriRO.xcodeproj \
            -scheme StiriRO \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package and validate IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && /usr/bin/zip -qry ../StiriRO-unsigned-${EXPECTED_VERSION}.ipa Payload)
          unzip -t "build/StiriRO-unsigned-${EXPECTED_VERSION}.ipa" >/dev/null
          bash scripts/verify-ios-ipa.sh "build/StiriRO-unsigned-${EXPECTED_VERSION}.ipa" "$EXPECTED_VERSION"

      - name: Attach iOS IPA to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "build/StiriRO-unsigned-$(node -p "require('./package.json').version").ipa" --repo "$GITHUB_REPOSITORY" --clobber
