name: Build Android test APK
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
      - "test/android.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Check Android catalog and version compatibility
        run: node --test test/android.test.js
      - name: Build and inspect debug APK
        run: |
          gradle -p android --no-daemon :app:assembleDebug
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ${ANDROID_HOME}/build-tools/34.0.0/aapt dump badging "$APK" | head -30
          ${ANDROID_HOME}/build-tools/34.0.0/aapt dump badging "$APK" | grep "package: name='ro.stiriro.android'"
          ${ANDROID_HOME}/build-tools/34.0.0/aapt dump badging "$APK" | grep "versionName='0.0.10'"
      - name: Upload APK for direct installation
        uses: actions/upload-artifact@v4
        with:
          name: StiriRO-Android-0.0.10-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
